<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Paris Expenses</title>
  <meta name="description" content="Private expense tracker for an exchange semester. All data stays on this device.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F7F7F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E10" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Expenses">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="vendor/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply saved theme + accent before first paint (mirrored by settings.js).
    try {
      var t = JSON.parse(localStorage.getItem('pe.theme') || 'null');
      if (t) {
        if (t.theme && t.theme !== 'system') document.documentElement.dataset.theme = t.theme;
        if (t.accent) document.documentElement.style.setProperty('--accent', t.accent);
      }
    } catch (e) {}
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell">
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>
  <noscript><p style="padding:16px">This app needs JavaScript.</p></noscript>
</body>
</html>
